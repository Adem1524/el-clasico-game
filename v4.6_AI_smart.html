<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Buz Sahası Futbol v4.8</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overscroll-behavior: none; }
body {
  background: #05070f; color: #fff; font-family: -apple-system, Arial, sans-serif;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  min-height: 100vh; padding: 8px; gap: 4px;
}

#setupScreen {
  width: 100%; max-width: 400px;
  background: #10131f; border-radius: 14px; border: 1px solid #262b40;
  padding: 18px; display: flex; flex-direction: column; gap: 14px;
}
#setupScreen h1 { font-size: 20px; font-weight: 900; color: #ffd369; text-align: center; letter-spacing: 1px; }
.setup-section { display: flex; flex-direction: column; gap: 8px; }
.setup-section label { font-size: 11px; font-weight: 700; color: #7d8bab; text-transform: uppercase; letter-spacing: 1px; }

.team-cfg { background: #181c2e; border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.team-cfg .row { display: flex; align-items: center; gap: 8px; }
.team-cfg .row span { font-size: 11px; color: #7d8bab; min-width: 44px; }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.swatch {
  width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent;
  cursor: pointer; transition: transform .15s, border-color .15s;
}
.swatch:hover { transform: scale(1.15); }
.swatch.sel { border-color: #fff; transform: scale(1.1); box-shadow: 0 0 0 2px rgba(255,255,255,.3); }
select {
  flex: 1; padding: 6px 8px; background: #10131f; color: #fff;
  border: 1px solid #262b40; border-radius: 7px; font-size: 12px; outline: none;
}

.setting-row { display: flex; align-items: center; gap: 8px; background: #181c2e; border-radius: 10px; padding: 8px 12px; }
.setting-row span { font-size: 11px; color: #7d8bab; min-width: 80px; }
.setting-row input[type=range] { flex: 1; accent-color: #3ec6e0; }
.setting-row .val { font-size: 12px; font-weight: 700; color: #ffd369; min-width: 28px; text-align: right; }
#startBtn {
  padding: 13px; background: #1e824c; color: #fff; border: none;
  border-radius: 10px; font-size: 14px; font-weight: 800; cursor: pointer; letter-spacing: .5px;
}
#startBtn:hover { background: #26a060; }

#score-board {
  width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center;
  background: #10131f; padding: 7px 12px; border-radius: 10px; border: 1px solid #262b40;
}
.team { display: flex; align-items: center; gap: 5px; font-weight: 800; font-size: 11px; letter-spacing: .5px; }
.badge { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 900; border: 2px solid rgba(255,255,255,.3); color: #fff; }
#score { font-size: 18px; font-weight: 900; color: #ffd369; }
#timer { font-size: 10px; color: #7d8bab; margin-top: -2px; text-align: center; }
#periodInfo { font-size: 9px; color: #4a5568; text-align: center; }

canvas {
  background: #0b3d24; border-radius: 12px; border: 3px solid #262b40;
  display: block; touch-action: none; max-height: 62vh; width: auto;
  aspect-ratio: 340/500;
}

.controls { width: 100%; max-width: 400px; display: flex; gap: 8px; }
button.ctrl { flex: 1; padding: 9px; border: none; font-weight: 700; border-radius: 9px; font-size: 11.5px; cursor: pointer; }
#reset-btn { background: #1e824c; color: #fff; }
#mode-btn { background: #2a5cc7; color: #fff; }
#control-mode-btn { background: #6c3fc7; color: #fff; }
#quit-btn { background: #c73e54; color: #fff; }

#arrowPad { display: none; flex-direction: column; align-items: center; gap: 4px; }
.arrowRow { display: flex; gap: 4px; align-items: center; }
.dpad-btn {
  width: 46px; height: 46px; border-radius: 9px; background: #16223d;
  border: 2px solid #3ec6e0; color: #6cc4ff; font-size: 18px; font-weight: 900;
  display: flex; align-items: center; justify-content: center; cursor: pointer; touch-action: none;
}
.dpad-btn:active { background: #3ec6e0; color: #16223d; }
.dpad-spacer { width: 46px; height: 46px; }
#shootBar { display: none; flex-direction: column; align-items: center; gap: 4px; width: 100%; max-width: 400px; }
#shootBarTrack { width: 100%; height: 22px; background: #16223d; border: 2px solid #3ec6e0; border-radius: 8px; overflow: hidden; position: relative; }
#shootBarFill { height: 100%; width: 0%; background: linear-gradient(90deg, #4ecca3, #ffd369, #e94560); transition: width .05s linear; }
#shootBtn { width: 100%; padding: 12px; border-radius: 9px; background: #e94560; color: #fff; font-weight: 800; font-size: 13px; border: none; cursor: pointer; }
#shootBtn:active { background: #c73e54; }

#goalFlash {
  position: absolute; top: 42%; left: 50%; transform: translate(-50%, -50%);
  font-size: 36px; font-weight: 900; color: #ffd369; text-shadow: 2px 2px 8px #000;
  opacity: 0; pointer-events: none; transition: opacity .25s; letter-spacing: 1px;
}
#pitchWrap { position: relative; }
#endOverlay {
  position: absolute; inset: 0; background: rgba(5,7,15,.9); border-radius: 10px;
  display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  text-align: center; padding: 20px;
}
#endOverlay h2 { font-size: 22px; color: #ffd369; }
#endOverlay p { font-size: 14px; color: #cdd5ee; }
.end-btns { display: flex; gap: 8px; margin-top: 6px; }
.end-btns button { padding: 10px 20px; border: none; border-radius: 8px; color: #fff; font-weight: 700; cursor: pointer; font-size: 12px; }
#playAgainBtn { background: #1e824c; }
#setupBtn { background: #2a5cc7; }
</style>
</head>
<body>

<div id="setupScreen">
  <h1>BUZ SAHASI FUTBOL</h1>

  <div class="setup-section">
    <label>Senin Takımın (Alt Taraf)</label>
    <div class="team-cfg">
      <div class="row">
        <span>Takım</span>
        <select id="homeTeamSel"></select>
      </div>
      <div class="row">
        <span>Renk</span>
        <div class="swatches" id="homeSwatches"></div>
      </div>
    </div>
  </div>

  <div class="setup-section">
    <label>Rakip Takım (Üst Taraf)</label>
    <div class="team-cfg">
      <div class="row">
        <span>Takım</span>
        <select id="awayTeamSel"></select>
      </div>
      <div class="row">
        <span>Renk</span>
        <div class="swatches" id="awaySwatches"></div>
      </div>
    </div>
  </div>

  <div class="setup-section">
    <label>Oyun Ayarları</label>
    <div class="setting-row">
      <span>Zorluk</span>
      <select id="diffSel" style="flex:1">
        <option value="easy">Kolay</option>
        <option value="normal" selected>Normal</option>
        <option value="hard">Zor</option>
      </select>
    </div>
    <div class="setting-row">
      <span>Periyot Süresi</span>
      <input type="range" id="periodTimeSel" min="30" max="180" step="30" value="90">
      <span class="val" id="periodTimeVal">90s</span>
    </div>
    <div class="setting-row">
      <span>Periyot Sayısı</span>
      <input type="range" id="periodCountSel" min="1" max="4" step="1" value="3">
      <span class="val" id="periodCountVal">3</span>
    </div>
    <div class="setting-row">
      <span>Kale Boyutu</span>
      <input type="range" id="goalSizeSel" min="70" max="160" step="10" value="110">
      <span class="val" id="goalSizeVal">Orta</span>
    </div>
    <div class="setting-row">
      <span>Şut Hızı</span>
      <input type="range" id="shotSpeedSel" min="8" max="20" step="1" value="14">
      <span class="val" id="shotSpeedVal">14</span>
    </div>
    <div class="setting-row">
      <span>Mod</span>
      <select id="modeSel" style="flex:1">
        <option value="vsAI">VS Yapay Zeka</option>
        <option value="2P">2 Oyuncu</option>
      </select>
    </div>
  </div>

  <button id="startBtn">MAÇA BAŞLA</button>
</div>

<div id="gameScreen" style="display:none;flex-direction:column;align-items:center;gap:6px;width:100%;max-width:400px;">
  <div id="score-board">
    <div class="team" id="homeBadgeWrap">
      <div class="badge" id="homeBadge">BJK</div>
      <span id="homeLabel">Beşiktaş</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;">
      <div id="score">0 - 0</div>
      <div id="timer">1:30</div>
      <div id="periodInfo">Periyot 1</div>
    </div>
    <div class="team" id="awayBadgeWrap" style="flex-direction:row-reverse;">
      <div class="badge" id="awayBadge">FB</div>
      <span id="awayLabel">Fenerbahçe</span>
    </div>
  </div>

  <div id="pitchWrap">
    <canvas id="canvas" width="340" height="500"></canvas>
    <div id="goalFlash">GOL!</div>
    <div id="endOverlay">
      <h2 id="endTitle"></h2>
      <p id="endSub"></p>
      <div class="end-btns">
        <button id="playAgainBtn">Tekrar Oyna</button>
        <button id="setupBtn">Yeni Kurulum</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl" id="reset-btn">Yeniden Başlat</button>
    <button class="ctrl" id="mode-btn">VS Yapay Zeka</button>
  </div>
  <div class="controls">
    <button class="ctrl" id="control-mode-btn">Kontrol: Sürükle</button>
    <button class="ctrl" id="quit-btn">Kur. Dön</button>
  </div>

  <div id="arrowPad">
    <button class="dpad-btn" id="btnUp">▲</button>
    <div class="arrowRow">
      <button class="dpad-btn" id="btnLeft">◀</button>
      <div class="dpad-spacer"></div>
      <button class="dpad-btn" id="btnRight">▶</button>
    </div>
    <button class="dpad-btn" id="btnDown">▼</button>
  </div>

  <div id="shootBar">
    <div id="shootBarTrack"><div id="shootBarFill"></div></div>
    <button id="shootBtn">VUR (basılı tut → bırak)</button>
  </div>
</div>

<script>
const TEAMS = [
  { name: 'Beşiktaş',       abbr: 'BJK', colors: ['#000000', '#FFFFFF'] },
  { name: 'Fenerbahçe',     abbr: 'FB',  colors: ['#FFD700', '#1a1a2e'] },
  { name: 'Galatasaray',    abbr: 'GS',  colors: ['#E20712', '#F5A800'] },
  { name: 'Trabzonspor',    abbr: 'TS',  colors: ['#8B0000', '#1a3d6e'] },
  { name: 'Başakşehir',     abbr: 'BŞK', colors: ['#FF6600', '#001f5b'] },
  { name: 'Sivasspor',      abbr: 'SİV', colors: ['#CC0000', '#FFD700'] },
  { name: 'Konyaspor',      abbr: 'KON', colors: ['#006400', '#FFFFFF'] },
  { name: 'Bursaspor',      abbr: 'BUR', colors: ['#228B22', '#FFFFFF'] },
  { name: 'Adana Demirspor',abbr: 'ADS', colors: ['#0055A5', '#E30613'] },
  { name: 'Antalyaspor',    abbr: 'ANT', colors: ['#CC0000', '#FFFFFF'] },
  { name: 'Özel (Mavi)',    abbr: 'MY',  colors: ['#3ec6e0', '#16223d'] },
  { name: 'Özel (Kırmızı)', abbr: 'KŞ',  colors: ['#e94560', '#3a0f18'] },
];

const PALETTE = [
  '#000000','#FFFFFF','#FFD700','#3ec6e0','#e94560','#F5A800',
  '#E20712','#228B22','#8B0000','#006400','#FF6600','#0055A5',
  '#C0C0C0','#9B59B6','#1a3d6e','#FF1493','#FF8C00','#00CED1'
];

const W = 340, H = 500;
let GOAL_W = 110;
let G_LEFT = (W - GOAL_W) / 2;
let G_RIGHT = (W + GOAL_W) / 2;
let MAX_SHOT_VEL = 14;
let PERIOD_TIME = 90;
let PERIOD_COUNT = 3;

let vsAI = true;
let scoreA = 0, scoreB = 0;
let isGoal = false, matchOver = false;
let currentPeriod = 1;
let periodTimeLeft = PERIOD_TIME;
let lastTickTs = null;
let controlMode = 'drag';
let activePlayerA = null;
let difficultyLevel = 'normal';

let homeTeam = TEAMS[0];
let awayTeam = TEAMS[1];
let homeColor = homeTeam.colors[0];
let awayColor = awayTeam.colors[0];

const setupScreen = document.getElementById('setupScreen');
const gameScreen  = document.getElementById('gameScreen');

function populateTeamSelect(id, defaultIdx) {
  const sel = document.getElementById(id);
  TEAMS.forEach((t, i) => {
    const opt = document.createElement('option');
    opt.value = i; opt.textContent = t.name;
    sel.appendChild(opt);
  });
  sel.value = defaultIdx;
}
populateTeamSelect('homeTeamSel', 0);
populateTeamSelect('awayTeamSel', 1);

function buildSwatches(containerId, defaultColor, onSelect) {
  const container = document.getElementById(containerId);
  PALETTE.forEach(color => {
    const s = document.createElement('div');
    s.className = 'swatch' + (color.toLowerCase() === defaultColor.toLowerCase() ? ' sel' : '');
    s.style.background = color;
    s.style.border = color === '#FFFFFF' ? '2px solid #444' : '2px solid transparent';
    s.addEventListener('click', () => {
      container.querySelectorAll('.swatch').forEach(x => x.classList.remove('sel'));
      s.classList.add('sel');
      onSelect(color);
    });
    container.appendChild(s);
  });
}

buildSwatches('homeSwatches', homeColor, c => { homeColor = c; });
buildSwatches('awaySwatches', awayColor, c => { awayColor = c; });

document.getElementById('homeTeamSel').addEventListener('change', function() {
  homeTeam = TEAMS[+this.value];
  homeColor = homeTeam.colors[0];
  updateSwatchSelection('homeSwatches', homeColor);
});
document.getElementById('awayTeamSel').addEventListener('change', function() {
  awayTeam = TEAMS[+this.value];
  awayColor = awayTeam.colors[0];
  updateSwatchSelection('awaySwatches', awayColor);
});

function updateSwatchSelection(containerId, color) {
  const container = document.getElementById(containerId);
  container.querySelectorAll('.swatch').forEach(s => {
    const isMatch = s.style.background === color || rgbToHex(s.style.background).toLowerCase() === color.toLowerCase();
    s.classList.toggle('sel', isMatch);
  });
}

function rgbToHex(rgb) {
  const m = rgb.match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/);
  if (!m) return rgb;
  return '#' + [m[1],m[2],m[3]].map(n => (+n).toString(16).padStart(2,'0')).join('');
}

function bindSlider(id, valId, formatter) {
  const sl = document.getElementById(id);
  const vl = document.getElementById(valId);
  vl.textContent = formatter(sl.value);
  sl.addEventListener('input', () => { vl.textContent = formatter(sl.value); });
}

bindSlider('periodTimeSel', 'periodTimeVal', v => v + 's');
bindSlider('periodCountSel', 'periodCountVal', v => v);
bindSlider('goalSizeSel', 'goalSizeVal', v => +v <= 80 ? 'Küçük' : +v <= 120 ? 'Orta' : 'Büyük');
bindSlider('shotSpeedSel', 'shotSpeedVal', v => v);

document.getElementById('startBtn').addEventListener('click', () => {
  homeTeam = TEAMS[+document.getElementById('homeTeamSel').value];
  awayTeam = TEAMS[+document.getElementById('awayTeamSel').value];
  GOAL_W = +document.getElementById('goalSizeSel').value;
  G_LEFT = (W - GOAL_W) / 2;
  G_RIGHT = (W + GOAL_W) / 2;
  MAX_SHOT_VEL = +document.getElementById('shotSpeedSel').value;
  PERIOD_TIME = +document.getElementById('periodTimeSel').value;
  PERIOD_COUNT = +document.getElementById('periodCountSel').value;
  difficultyLevel = document.getElementById('diffSel').value;
  vsAI = document.getElementById('modeSel').value === 'vsAI';
  setupScreen.style.display = 'none';
  gameScreen.style.display = 'flex';
  applyTeamUI();
  startMatch();
});

function applyTeamUI() {
  document.getElementById('homeBadge').textContent = homeTeam.abbr;
  document.getElementById('homeBadge').style.background = homeColor;
  document.getElementById('homeBadge').style.color = getContrastColor(homeColor);
  document.getElementById('homeLabel').textContent = homeTeam.name;
  
  document.getElementById('awayBadge').textContent = awayTeam.abbr;
  document.getElementById('awayBadge').style.background = awayColor;
  document.getElementById('awayBadge').style.color = getContrastColor(awayColor);
  document.getElementById('awayLabel').textContent = awayTeam.name;
  
  document.getElementById('mode-btn').textContent = vsAI ? 'VS Yapay Zeka' : '2 Oyuncu';
}

function getContrastColor(hex) {
  if (!hex.startsWith('#')) return '#fff';
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return (r*299 + g*587 + b*114) / 1000 > 128 ? '#111' : '#fff';
}

const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');

class Ball {
  constructor() { this.r = 8; this.reset(); }
  reset() { this.x = W/2; this.y = H/2; this.vx = 0; this.vy = 0; }
  update() {
    this.x += this.vx; this.y += this.vy;
    this.vx *= 0.985; this.vy *= 0.985;

    if (this.x - this.r < 0) { this.x = this.r; this.vx *= -0.85; }
    if (this.x + this.r > W) { this.x = W - this.r; this.vx *= -0.85; }

    if (this.y - this.r < 0) {
      if (this.x > G_LEFT && this.x < G_RIGHT) {
        if (!isGoal) handleGoal('A');
      } else { this.y = this.r; this.vy *= -0.85; }
    }
    if (this.y + this.r > H) {
      if (this.x > G_LEFT && this.x < G_RIGHT) {
        if (!isGoal) handleGoal('B');
      } else { this.y = H - this.r; this.vy *= -0.85; }
    }
  }
  draw() {
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
    ctx.fillStyle = '#f5f5f5'; ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = '#222'; ctx.stroke();
  }
}

class Disk {
  constructor(team, isKeeper, label) {
    this.team = team; this.isKeeper = isKeeper; this.label = label;
    this.r = isKeeper ? 13 : 15;
    this.x = 0; this.y = 0; this.vx = 0; this.vy = 0;
  }
  teamColor() { return this.team === 'A' ? homeColor : awayColor; }
  update() {
    this.x += this.vx; this.y += this.vy;
    this.vx *= 0.96; this.vy *= 0.96;

    if (this.isKeeper) {
      this.vy = 0;
      this.y = this.team === 'A' ? H - 22 : 22;
      const margin = this.r + 20;
      const target = Math.max(G_LEFT + margin, Math.min(G_RIGHT - margin, ball.x));
      const speed  = difficultyLevel === 'hard' ? 0.08 : difficultyLevel === 'normal' ? 0.055 : 0.035;
      this.x += (target - this.x) * speed;
      return;
    }

    const r = this.r;
    if (this.x - r < 0) { this.x = r;     this.vx *= -0.7; }
    if (this.x + r > W) { this.x = W - r; this.vx *= -0.7; }
    if (this.y - r < 0) { this.y = r;     this.vy *= -0.7; }
    if (this.y + r > H) { this.y = H - r; this.vy *= -0.7; }

    // OYUNCU A (İNSAN) ORTA SAHA ÇİZGİSİNİ (H/2) AŞAĞIDAN YUKARIYA GEÇEMEZ
    if (this.team === 'A' && this.y - r < H/2) { this.y = H/2 + r; this.vy *= -0.5; }

    // OYUNCU B (YAPAY ZEKA) ORTA SAHA ÇİZGİSİNİ (H/2) YUKARIDAN AŞAĞIYA GEÇEMEZ
    if (this.team === 'B' && this.y + r > H/2) { this.y = H/2 - r; this.vy *= -0.5; }
  }
  draw() {
    const clr = this.teamColor();
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
    ctx.fillStyle = clr;
    ctx.strokeStyle = getContrastColor(clr) === '#111' ? 'rgba(0,0,0,0.5)' : 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 3; ctx.fill(); ctx.stroke();

    if (controlMode === 'arrows' && this === activePlayerA) {
      ctx.beginPath(); ctx.arc(this.x, this.y, this.r+5, 0, Math.PI*2);
      ctx.strokeStyle = '#ffd369'; ctx.lineWidth = 2; ctx.stroke();
    }

    ctx.fillStyle = getContrastColor(clr) === '#111' ? '#000' : '#fff';
    ctx.font = 'bold 9px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(this.label, this.x, this.y);
  }
}

const ball = new Ball();
const disks = [
  new Disk('A', true,  'K'),
  new Disk('A', false, '9'),
  new Disk('A', false, '11'),
  new Disk('A', false, '4'),
  new Disk('B', true,  'K'),
  new Disk('B', false, '7'),
  new Disk('B', false, '10'),
  new Disk('B', false, '5'),
];
const teamADisks = disks.filter(d => d.team === 'A');
const teamBDisks = disks.filter(d => d.team === 'B');

function resetPositions() {
  aiThinkTimer = 0;
  aiLastAttacker = null;
  aiPossessionTimer = 0;
  aiDecision = 'defend';
  ball.reset();
  disks[0].x = W/2;    disks[0].y = H - 22;
  disks[1].x = W*0.25; disks[1].y = H - 105;
  disks[2].x = W*0.5;  disks[2].y = H - 155;
  disks[3].x = W*0.75; disks[3].y = H - 105;

  disks[4].x = W/2;    disks[4].y = 22;
  disks[5].x = W*0.25; disks[5].y = 105;
  disks[6].x = W*0.5;  disks[6].y = 155;
  disks[7].x = W*0.75; disks[7].y = 105;
  disks.forEach(d => { d.vx = 0; d.vy = 0; });
}

let selected = null, dragPos = null;
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const cx = e.touches ? e.touches[0].clientX : e.clientX;
  const cy = e.touches ? e.touches[0].clientY : e.clientY;
  return { x: (cx - rect.left) * (W / rect.width), y: (cy - rect.top) * (H / rect.height) };
}

const handleStart = e => {
  if (matchOver || controlMode !== 'drag') return;
  const pos = getPos(e);
  for (const d of disks) {
    if (d.isKeeper) continue;
    if (vsAI && d.team === 'B') continue;
    if (Math.hypot(d.x - pos.x, d.y - pos.y) < d.r + 16) {
      selected = d; dragPos = pos; break;
    }
  }
};
const handleMove = e => { if (selected) dragPos = getPos(e); };
const handleEnd = () => {
  if (selected && dragPos) {
    const dx = selected.x - dragPos.x, dy = selected.y - dragPos.y;
    const dist = Math.hypot(dx, dy);
    const p = Math.min(dist * 0.18, MAX_SHOT_VEL);
    if (p > 0.5) {
      const a = Math.atan2(dy, dx);
      selected.vx = Math.cos(a) * p;
      selected.vy = Math.sin(a) * p;
    }
  }
  selected = null; dragPos = null;
};

canvas.addEventListener('touchstart', handleStart, {passive:true});
canvas.addEventListener('mousedown', handleStart);
window.addEventListener('touchmove', handleMove, {passive:true});
window.addEventListener('mousemove', handleMove);
window.addEventListener('touchend', handleEnd);
window.addEventListener('mouseup', handleEnd);

const ARROW_SPEED = 3.5;
const keys = { up:false, down:false, left:false, right:false };
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k==='arrowup'   ||k==='w') { keys.up=true;    e.preventDefault(); }
  if (k==='arrowdown' ||k==='s') { keys.down=true;  e.preventDefault(); }
  if (k==='arrowleft' ||k==='a') { keys.left=true;  e.preventDefault(); }
  if (k==='arrowright'||k==='d') { keys.right=true; e.preventDefault(); }
});
window.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (k==='arrowup'   ||k==='w') keys.up=false;
  if (k==='arrowdown' ||k==='s') keys.down=false;
  if (k==='arrowleft' ||k==='a') keys.left=false;
  if (k==='arrowright'||k==='d') keys.right=false;
});

function bindDpad(id, key) {
  const el = document.getElementById(id);
  const on  = ev => { ev.preventDefault(); keys[key] = true;  };
  const off = ev => { if(ev) ev.preventDefault(); keys[key] = false; };
  el.addEventListener('touchstart', on, {passive:false});
  el.addEventListener('touchend',   off,{passive:false});
  el.addEventListener('touchcancel',off,{passive:false});
  el.addEventListener('mousedown',  on);
  el.addEventListener('mouseup',    off);
  el.addEventListener('mouseleave', off);
}
bindDpad('btnUp','up'); bindDpad('btnDown','down');
bindDpad('btnLeft','left'); bindDpad('btnRight','right');

function updateArrowControl() {
  const cands = teamADisks.filter(d => !d.isKeeper);
  let active = null, bestD = Infinity;
  for (const d of cands) {
    const dd = Math.hypot(d.x - ball.x, d.y - ball.y);
    if (dd < bestD) { bestD = dd; active = d; }
  }
  activePlayerA = active;
  if (!active) return;
  let dx = 0, dy = 0;
  if (keys.up)    dy -= 1;
  if (keys.down)  dy += 1;
  if (keys.left)  dx -= 1;
  if (keys.right) dx += 1;
  if (dx || dy) {
    const n = Math.hypot(dx, dy);
    active.vx = dx/n * ARROW_SPEED;
    active.vy = dy/n * ARROW_SPEED;
  }
}

const shootBarFill = document.getElementById('shootBarFill');
const shootBtn     = document.getElementById('shootBtn');
let shootPower = 0, shootCharging = false, shootLockFrames = 0, pendingShootPower = 0;
const SHOOT_CHARGE_RATE = 2.5;

function chargeStart(e) { if(e) e.preventDefault(); shootCharging = true; }
function chargeEnd(e) {
  if (e) e.preventDefault();
  if (shootCharging && activePlayerA && shootPower > 5) {
    const power = shootPower / 100;
    const dx = ball.x - activePlayerA.x, dy = ball.y - activePlayerA.y;
    const dist = Math.hypot(dx, dy);
    const nx = dx/(dist||1), ny = dy/(dist||1);
    if (dist < activePlayerA.r + ball.r + 14) {
      ball.vx = nx * power * MAX_SHOT_VEL;
      ball.vy = ny * power * MAX_SHOT_VEL;
      activePlayerA.vx = nx * power * (MAX_SHOT_VEL * 0.35);
      activePlayerA.vy = ny * power * (MAX_SHOT_VEL * 0.35);
      shootLockFrames = 6;
    } else {
      activePlayerA.vx = nx * (5 + power * 6);
      activePlayerA.vy = ny * (5 + power * 6);
      pendingShootPower = power;
    }
  }
  shootCharging = false; shootPower = 0;
  shootBarFill.style.width = '0%';
}

shootBtn.addEventListener('touchstart', chargeStart, {passive:false});
shootBtn.addEventListener('touchend',   chargeEnd,   {passive:false});
shootBtn.addEventListener('touchcancel',chargeEnd,   {passive:false});
shootBtn.addEventListener('mousedown',  chargeStart);
shootBtn.addEventListener('mouseup',    chargeEnd);

function updateShootBar() {
  if (!shootCharging) return;
  shootPower = Math.min(100, shootPower + SHOOT_CHARGE_RATE);
  shootBarFill.style.width = shootPower + '%';
}

function resolveCollisions() {
  const all = [...disks, ball];
  for (let i = 0; i < all.length; i++) {
    for (let j = i+1; j < all.length; j++) {
      const o1 = all[i], o2 = all[j];
      if (shootLockFrames > 0 && (o1 === ball || o2 === ball)) continue;
      const dx = o2.x - o1.x, dy = o2.y - o1.y;
      const dist = Math.hypot(dx, dy);
      const minD = o1.r + o2.r;
      if (dist < minD && dist > 0) {
        const overlap = minD - dist + 0.5;
        const nx = dx/dist, ny = dy/dist;
        if (!o1.isKeeper) { o1.x -= nx*overlap*0.5; o1.y -= ny*overlap*0.5; }
        if (!o2.isKeeper) { o2.x += nx*overlap*0.5; o2.y += ny*overlap*0.5; }
        const relVx = o1.vx - o2.vx, relVy = o1.vy - o2.vy;
        const p = (nx*relVx + ny*relVy) * 0.95;
        if (!o1.isKeeper) { o1.vx -= p*nx; o1.vy -= p*ny; }
        if (!o2.isKeeper) { o2.vx += p*nx; o2.vy += p*ny; }
        if ((o1 === ball && o2.isKeeper) || (o2 === ball && o1.isKeeper)) {
          const k = o1.isKeeper ? o1 : o2;
          ball.vy = k.team === 'A' ? -Math.abs(ball.vy) - 1.0 : Math.abs(ball.vy) + 1.0;
        }
      }
    }
  }
}

// ---- AKILLI YAPAY ZEKA v2 ----
// AI; top takibi, pas/pozisyon alma, savunma, şut açısı,
// tehdit algılama ve rol değişimi kullanır.

let aiThinkTimer = 0;
let aiTargetX = W / 2;
let aiTargetY = H / 2;
let aiLastAttacker = null;
let aiDecision = 'defend';
let aiPossessionTimer = 0;

function aiClamp(v, min, max) {
  return Math.max(min, Math.min(max, v));
}

function aiDistance(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function aiNearestOpponent(d) {
  let best = null, bestD = Infinity;
  for (const p of teamADisks) {
    if (p.isKeeper) continue;
    const dd = aiDistance(d, p);
    if (dd < bestD) { bestD = dd; best = p; }
  }
  return { player: best, distance: bestD };
}

function aiBallDanger() {
  // İnsan oyuncusu AI kalesine yaklaştıkça savunma önceliği artar.
  return aiClamp((H - ball.y) / (H * 0.58), 0, 1);
}

function aiGoalTarget() {
  // Kalecinin bulunduğu tarafa değil, boş kalan tarafa yönel.
  const keeper = disks.find(d => d.team === 'A' && d.isKeeper);
  const keeperX = keeper ? keeper.x : W / 2;
  const offset = ball.x < keeperX ? 28 : -28;
  return aiClamp(W / 2 + offset, G_LEFT + 12, G_RIGHT - 12);
}

function aiPassTarget(from) {
  let best = null, bestScore = -Infinity;

  for (const mate of teamBDisks) {
    if (mate === from || mate.isKeeper) continue;

    const forward = H / 2 - mate.y;
    const central = 1 - Math.abs(mate.x - W / 2) / (W / 2);
    const separation = Math.min(aiDistance(from, mate) / 120, 1);
    const score = forward * 0.018 + central * 0.7 + separation * 0.45;

    if (score > bestScore) {
      bestScore = score;
      best = mate;
    }
  }
  return best;
}

function aiShootOrPass(attacker) {
  const nearBall = aiDistance(attacker, ball) < attacker.r + ball.r + 15;
  if (!nearBall || ball.y >= H / 2 - 10) return;

  const goalX = aiGoalTarget();
  const goalY = H - 6;
  const gx = goalX - ball.x;
  const gy = goalY - ball.y;
  const goalDist = Math.hypot(gx, gy) || 1;

  // Rakip kalecinin konumunu okuyup daha boş köşeyi seç.
  const keeper = disks.find(d => d.team === 'A' && d.isKeeper);
  const keeperGap = keeper ? Math.abs(goalX - keeper.x) : 50;

  const shootThreshold =
    difficultyLevel === 'hard' ? 0.25 :
    difficultyLevel === 'normal' ? 0.48 : 0.70;

  // Kötü açıdaysa pas/taşıma, iyi açıdaysa şut.
  const centrality = 1 - Math.abs(ball.x - W / 2) / (W / 2);
  const shootingScore = centrality * 0.55 + aiClamp(keeperGap / 90, 0, 1) * 0.45;

  if (shootingScore > shootThreshold) {
    const power =
      difficultyLevel === 'hard' ? MAX_SHOT_VEL * 0.96 :
      difficultyLevel === 'normal' ? MAX_SHOT_VEL * 0.84 :
      MAX_SHOT_VEL * 0.70;

    ball.vx = (gx / goalDist) * power;
    ball.vy = (gy / goalDist) * power;
    attacker.vx *= 0.2;
    attacker.vy *= 0.2;
    aiPossessionTimer = 18;
    return true;
  }

  // Pas kararı: önünde rakip varsa ve boş takım arkadaşı varsa.
  const passTo = aiPassTarget(attacker);
  if (passTo && aiPossessionTimer <= 0) {
    const pdx = passTo.x - ball.x;
    const pdy = passTo.y - ball.y;
    const pd = Math.hypot(pdx, pdy) || 1;

    const passPower = difficultyLevel === 'hard' ? 9.0 :
                      difficultyLevel === 'normal' ? 7.5 : 6.0;

    ball.vx = (pdx / pd) * passPower;
    ball.vy = (pdy / pd) * passPower;
    attacker.vx *= 0.35;
    attacker.vy *= 0.35;
    aiPossessionTimer = 22;
    return true;
  }

  return false;
}

function updateOpponentAI(dt = 1/60) {
  const speed =
    difficultyLevel === 'hard' ? 5.2 :
    difficultyLevel === 'normal' ? 4.15 : 3.15;

  const cands = teamBDisks.filter(d => !d.isKeeper);
  const attacker = nearestToBall('B');
  const aiBoundary = H / 2 - 18;
  const danger = aiBallDanger();

  if (aiPossessionTimer > 0) aiPossessionTimer--;

  // AI düşünme aralığı: zor seviyede daha hızlı karar.
  if (aiThinkTimer <= 0 || aiLastAttacker !== attacker) {
    aiThinkTimer =
      difficultyLevel === 'hard' ? 5 :
      difficultyLevel === 'normal' ? 8 : 12;

    aiLastAttacker = attacker;

    if (ball.y > H / 2) {
      // Rakip hücumda: en yakın oyuncu baskı yapar.
      aiDecision = 'press';
    } else if (danger > 0.62) {
      aiDecision = 'defend';
    } else {
      aiDecision = 'attack';
    }

    if (attacker) {
      if (aiDecision === 'press') {
        aiTargetX = ball.x;
        aiTargetY = Math.min(ball.y, aiBoundary);
      } else if (aiDecision === 'defend') {
        aiTargetX = W / 2 + (ball.x - W / 2) * 0.45;
        aiTargetY = Math.min(H * 0.30 + ball.y * 0.18, aiBoundary);
      } else {
        aiTargetX = ball.x;
        aiTargetY = Math.min(ball.y, aiBoundary);
      }
    }
  }
  aiThinkTimer--;

  cands.forEach((d, index) => {
    const isAttacker = d === attacker;
    const nearestOpp = aiNearestOpponent(d);

    if (isAttacker) {
      let tx = aiTargetX;
      let ty = aiTargetY;

      // Rakip çok yakındaysa topa düz koşmak yerine hafif yan açı al.
      if (nearestOpp.player && nearestOpp.distance < 55 && ball.y < H / 2) {
        const side = d.x < W / 2 ? -1 : 1;
        tx += side * 22;
      }

      const dx = tx - d.x;
      const dy = ty - d.y;
      const dist = Math.hypot(dx, dy) || 1;

      const desiredVx = dx / dist * speed;
      const desiredVy = dy / dist * speed;

      d.vx += (desiredVx - d.vx) * 0.24;
      d.vy += (desiredVy - d.vy) * 0.24;

      aiShootOrPass(d);
    } else {
      // Savunmada oyuncular kaleyi ve rakip hücumcuları marke eder.
      let tx, ty;

      if (aiDecision === 'press' && index === 0) {
        tx = ball.x * 0.65 + W / 2 * 0.35;
        ty = Math.min(ball.y + 28, aiBoundary - 25);
      } else if (danger > 0.55) {
        const mark = aiNearestOpponent(d).player;
        tx = mark ? (mark.x * 0.42 + W / 2 * 0.58) : W / 2;
        ty = mark ? Math.min(mark.y - 12, aiBoundary - 25) : 120;
      } else {
        // Hücumdayken genişlik ve derinlik koru.
        tx = index % 2 === 0 ? W * 0.28 : W * 0.72;
        tx = tx * 0.65 + ball.x * 0.35;
        ty = 105 + aiClamp((H / 2 - ball.y) / 220, 0, 1) * 65;
      }

      ty = Math.min(ty, aiBoundary - 25);

      const dx = tx - d.x;
      const dy = ty - d.y;
      d.vx += dx * 0.018;
      d.vy += dy * 0.018;

      const maxV = speed * 0.64;
      const v = Math.hypot(d.vx, d.vy);
      if (v > maxV) {
        d.vx = d.vx / v * maxV;
        d.vy = d.vy / v * maxV;
      }

      d.vx *= 0.91;
      d.vy *= 0.91;
    }

    // Kesin orta saha sınırı.
    const maxY = aiBoundary - d.r;
    if (d.y > maxY) {
      d.y = maxY;
      if (d.vy > 0) d.vy *= -0.45;
    }
  });
}

function nearestToBall(team) {
  const cands = disks.filter(d => d.team === team && !d.isKeeper);
  let best = null, bestD = Infinity;
  for (const d of cands) {
    const dd = Math.hypot(d.x - ball.x, d.y - ball.y);
    if (dd < bestD) { bestD = dd; best = d; }
  }
  return best;
}

const goalFlashEl = document.getElementById('goalFlash');
const endOverlay  = document.getElementById('endOverlay');
const scoreEl     = document.getElementById('score');
const timerEl     = document.getElementById('timer');
const periodInfoEl= document.getElementById('periodInfo');

function handleGoal(team) {
  isGoal = true;
  if (team === 'A') scoreA++; else scoreB++;
  scoreEl.textContent = `${scoreA} - ${scoreB}`;
  goalFlashEl.style.display = 'block';
  requestAnimationFrame(() => { goalFlashEl.style.opacity = '1'; });
  setTimeout(() => {
    goalFlashEl.style.opacity = '0';
    setTimeout(() => { goalFlashEl.style.display = 'none'; }, 260);
    resetPositions();
    isGoal = false;
  }, 1100);
}

function updateTimer(ts) {
  if (lastTickTs == null) lastTickTs = ts;
  const dt = (ts - lastTickTs) / 1000;
  lastTickTs = ts;
  if (matchOver || isGoal) return;
  periodTimeLeft -= dt;
  if (periodTimeLeft <= 0) {
    periodTimeLeft = 0;
    if (currentPeriod < PERIOD_COUNT) {
      currentPeriod++;
      periodTimeLeft = PERIOD_TIME;
      periodInfoEl.textContent = `Periyot ${currentPeriod}`;
      resetPositions();
    } else {
      endMatch();
    }
  }
  const s = Math.ceil(periodTimeLeft);
  const m = Math.floor(s / 60), sec = s % 60;
  timerEl.textContent = m + ':' + String(sec).padStart(2, '0');
}

function endMatch() {
  matchOver = true;
  endOverlay.style.display = 'flex';
  const title = scoreA > scoreB ? `${homeTeam.name} Kazandı!` : scoreB > scoreA ? `${awayTeam.name} Kazandı!` : 'Berabere!';
  document.getElementById('endTitle').textContent = title;
  document.getElementById('endSub').textContent = `Skor: ${scoreA} - ${scoreB}`;
}

function startMatch() {
  shootPower = 0;
  shootCharging = false;
  shootLockFrames = 0;
  pendingShootPower = 0;
  selected = null;
  dragPos = null;
  scoreA = 0; scoreB = 0;
  currentPeriod = 1;
  periodTimeLeft = PERIOD_TIME;
  lastTickTs = null;
  matchOver = false; isGoal = false;
  scoreEl.textContent = '0 - 0';
  periodInfoEl.textContent = 'Periyot 1';
  endOverlay.style.display = 'none';
  resetPositions();
}

function drawPitch() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0b3d24'; ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = 'rgba(255,255,255,0.025)';
  for (let y = 0; y < H; y += 36) if ((y/36)%2 === 0) ctx.fillRect(0, y, W, 36);

  ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 2;
  ctx.strokeRect(3, 3, W-6, H-6);
  ctx.beginPath(); ctx.moveTo(3, H/2); ctx.lineTo(W-3, H/2); ctx.stroke();
  ctx.beginPath(); ctx.arc(W/2, H/2, 42, 0, Math.PI*2); ctx.stroke();

  const gDepth = 22;
  ctx.strokeRect(G_LEFT, 3, GOAL_W, gDepth);
  ctx.strokeRect(G_LEFT, H-3-gDepth, GOAL_W, gDepth);

  ctx.fillStyle = awayColor; ctx.font = 'bold 10px Arial'; ctx.textAlign = 'center';
  ctx.fillText(awayTeam.abbr, W/2, 12);
  ctx.fillStyle = homeColor;
  ctx.fillText(homeTeam.abbr, W/2, H - 10);
}

function drawAimLine() {
  if (!selected || !dragPos) return;
  const dx = selected.x - dragPos.x, dy = selected.y - dragPos.y;
  ctx.beginPath();
  ctx.moveTo(selected.x, selected.y);
  ctx.lineTo(selected.x + dx * 0.45, selected.y + dy * 0.45);
  ctx.strokeStyle = '#ffd369';
  ctx.lineWidth = 3; ctx.setLineDash([4, 5]); ctx.stroke(); ctx.setLineDash([]);
}

function clampToPitch() {
  const cornerMargin = 22;
  const isNearLeft = ball.x < cornerMargin;
  const isNearRight = ball.x > W - cornerMargin;
  const isNearTop = ball.y < cornerMargin && (ball.x < G_LEFT || ball.x > G_RIGHT);
  const isNearBottom = ball.y > H - cornerMargin && (ball.x < G_LEFT || ball.x > G_RIGHT);

  if ((isNearLeft || isNearRight) && (isNearTop || isNearBottom)) {
    const pushX = W/2 - ball.x;
    const pushY = H/2 - ball.y;
    const dist = Math.hypot(pushX, pushY) || 1;
    ball.vx = (pushX / dist) * 4.5;
    ball.vy = (pushY / dist) * 4.5;
  }
}

function loop(ts) {
  const now = ts || performance.now();
  const frameDt = Math.min(0.033, lastTickTs == null ? 1/60 : Math.max(0.001, (now - lastTickTs) / 1000));

  if (!matchOver) {
    if (controlMode === 'arrows') { updateArrowControl(); updateShootBar(); }

    if (pendingShootPower > 0 && activePlayerA) {
      const dx2 = ball.x - activePlayerA.x, dy2 = ball.y - activePlayerA.y;
      const dist2 = Math.hypot(dx2, dy2);
      if (dist2 < activePlayerA.r + ball.r + 14) {
        const nx2 = dx2/(dist2||1), ny2 = dy2/(dist2||1);
        ball.vx = nx2 * pendingShootPower * MAX_SHOT_VEL;
        ball.vy = ny2 * pendingShootPower * MAX_SHOT_VEL;
        shootLockFrames = 6; pendingShootPower = 0;
      }
    }

    // AI kararını fizik güncellemesinden önce ver; böylece bir kare geriden kalmaz.
    if (vsAI) updateOpponentAI(frameDt);

    ball.update();
    disks.forEach(d => d.update());
    resolveCollisions();
    clampToPitch();

    if (shootLockFrames > 0) shootLockFrames--;
    updateTimer(now);
  }

  drawPitch();
  ball.draw();
  disks.forEach(d => d.draw());
  drawAimLine();

  requestAnimationFrame(loop);
}

document.getElementById('reset-btn').onclick = () => startMatch();

document.getElementById('mode-btn').onclick = () => {
  vsAI = !vsAI;
  document.getElementById('mode-btn').textContent = vsAI ? 'VS Yapay Zeka' : '2 Oyuncu';
  resetPositions();
  aiThinkTimer = 0;
  aiLastAttacker = null;
};

document.getElementById('control-mode-btn').onclick = () => {
  controlMode = controlMode === 'drag' ? 'arrows' : 'drag';
  document.getElementById('control-mode-btn').textContent = controlMode === 'drag' ? 'Kontrol: Sürükle' : 'Kontrol: Oklar';
  document.getElementById('arrowPad').style.display = controlMode === 'arrows' ? 'flex' : 'none';
  document.getElementById('shootBar').style.display = controlMode === 'arrows' ? 'flex' : 'none';
  selected = null; dragPos = null;
};

document.getElementById('quit-btn').onclick = () => {
  gameScreen.style.display = 'none';
  setupScreen.style.display = 'flex';
};

document.getElementById('playAgainBtn').onclick = () => startMatch();
document.getElementById('setupBtn').onclick = () => {
  endOverlay.style.display = 'none';
  gameScreen.style.display = 'none';
  setupScreen.style.display = 'flex';
};

resetPositions();
requestAnimationFrame(loop);
</script>
