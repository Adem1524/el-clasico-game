<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Buz Sahası Futbol v4.9</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overscroll-behavior: none; }
body {
  background: #05070f; color: #fff; font-family: -apple-system, Arial, sans-serif;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  min-height: 100vh; padding: 8px; gap: 4px;
}

#setupScreen {
  width: 100%; max-width: 400px;
  background: #10131f; border-radius: 14px; border: 1px solid #262b40;
  padding: 18px; display: flex; flex-direction: column; gap: 14px;
}
#setupScreen h1 { font-size: 20px; font-weight: 900; color: #ffd369; text-align: center; letter-spacing: 1px; }
.setup-section { display: flex; flex-direction: column; gap: 8px; }
.setup-section label { font-size: 11px; font-weight: 700; color: #7d8bab; text-transform: uppercase; letter-spacing: 1px; }

.team-cfg { background: #181c2e; border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.team-cfg .row { display: flex; align-items: center; gap: 8px; }
.team-cfg .row span { font-size: 11px; color: #7d8bab; min-width: 44px; }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.swatch {
  width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent;
  cursor: pointer; transition: transform .15s, border-color .15s;
}
.swatch:hover { transform: scale(1.15); }
.swatch.sel { border-color: #fff; transform: scale(1.1); box-shadow: 0 0 0 2px rgba(255,255,255,.3); }
select {
  flex: 1; padding: 6px 8px; background: #10131f; color: #fff;
  border: 1px solid #262b40; border-radius: 7px; font-size: 12px; outline: none;
}
